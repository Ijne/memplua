[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memplua-research"
version = "0.1.0"
description = "Contributor-only dataset preparation, LoRA training, and evaluation tools for memplua"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = [
  "datasets>=3.0",
  "peft>=0.13",
  "torch>=2.4",
  "transformers>=4.45",
]

[project.scripts]
memplua-research = "memplua_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memplua_research"]
